site_name: Multimedia and Application
site_author: Er. Harish Thagunna
site_description: Complete exam-ready notes, class slides, interactive practice and revision tools for BCA429CO Multimedia and Application, by Er. Harish Thagunna.
copyright: "&copy; 2026 Er. Harish Thagunna. All rights reserved."
site_url: https://thagunnaharish1-netizen.github.io/multimedia/
repo_url: https://github.com/thagunnaharish1-netizen/multimedia
repo_name: multimedia
edit_uri: edit/main/docs/

hooks:
  - hooks/site.py

theme:
  name: material
  custom_dir: overrides
  language: en
  favicon: assets/favicon.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
  features:
    - announce.dismiss
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tooltips
    - content.footnote.tooltips

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/sims.js
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/app.js

extra:
  exam_date_hint: "Set your exam date in the Revision planner"
  units:
    - {n: 1,  title: "Multimedia System",              hours: 3, weeks: "1",     blurb: "What multimedia is, its structure, media types and data streams.", icon: "layers"}
    - {n: 2,  title: "Sound and Audio",                hours: 4, weeks: "2–3",   blurb: "Sound physics, digital audio, MIDI and speech processing.", icon: "wave"}
    - {n: 3,  title: "Image and Graphics",             hours: 4, weeks: "3–4",   blurb: "Bitmaps, formats, graphics systems, dithering and recognition.", icon: "image"}
    - {n: 4,  title: "Video and Animation",            hours: 4, weeks: "4–5",   blurb: "Video signals, colour models, computer video and animation.", icon: "video"}
    - {n: 5,  title: "Data Compression",               hours: 6, weeks: "6–7",   blurb: "Huffman, run-length, JPEG, MPEG and coding categories.", icon: "compress"}
    - {n: 6,  title: "Optical Storage Media",          hours: 4, weeks: "8–9",   blurb: "CD-DA, CD-ROM, XA, DVD, Blu-ray, CD-WO and CD-MO.", icon: "disc"}
    - {n: 7,  title: "Multimedia Operating System",    hours: 4, weeks: "9–10",  blurb: "Real time, resource management, EDF and rate monotonic.", icon: "cpu"}
    - {n: 8,  title: "Multimedia Communication",       hours: 4, weeks: "10–11", blurb: "Application and transport subsystems, QoS and protocols.", icon: "network"}
    - {n: 9,  title: "Documents, Hypertext and MHEG",  hours: 4, weeks: "12–13", blurb: "Hypermedia, the Dexter model, SGML, ODA and MHEG.", icon: "link"}
    - {n: 10, title: "Synchronization",                hours: 4, weeks: "13–14", blurb: "Skew, reference model, specification and distributed sync.", icon: "clock"}
    - {n: 11, title: "Abstraction of Programming",     hours: 2, weeks: "14–15", blurb: "Libraries, toolkits, languages and object-oriented design.", icon: "code"}
    - {n: 12, title: "Multimedia Application",         hours: 2, weeks: "15",    blurb: "Application classes, systems and the development cycle.", icon: "app"}

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]
      auto_append:
        - docs/includes/abbreviations.md
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.arithmatex:
      generic: true

