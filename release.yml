# RELEASE CONTROL: choose what students can see.  (c) 2026 Er. Harish Thagunna
#
# Everything is LOCKED by default. Locked pages are published only as a
# "locked" notice: their text, slides, downloads and search entries are NOT
# included in the public website at all.
#
# After you teach a class, add the matching line(s) under "unlocked:" below,
# save (commit) this file on GitHub, and the site redeploys in about 2 minutes.
#
# What you can write (a name unlocks that page; a folder name unlocks all inside):
#   unit-01                    whole Unit 1 (overview, topics, slides, practice)
#   unit-01/multimedia-system  one topic note of Unit 1
#   unit-01/practice           practice questions of Unit 1
#   unit-01/slides             class slides of Unit 1 (the deck covers the whole unit)
#   class-01                   Class 1 introduction deck
#   syllabus, course-map, coverage
#   revision                   whole revision hub (mock exams, cheat sheets, glossaries)
#   revision/mock-exam-1       a single revision page
#   labs                       all labs and simulators, or e.g. labs/lab-dct
#   instructor                 instructor pack and answer bank (keep LOCKED for students)
#
# A unit overview page opens automatically when any topic of that unit is unlocked.
# Topic file names are the file names inside docs/unit-NN/ (without .md).
# ---------------------------------------------------------------------------

always_open:
  - index
  - about

unlocked:
